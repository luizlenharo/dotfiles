[[opener.edit]]
run   = 'nvim "$@"'
desc  = "nvim"
for   = "linux"
block = true

[[opener.browser]]
run    = 'xdg-open "$@"'
desc   = "Open in browser"
for    = "linux"
orphan = true

[open]
prepend_rules = [
  { url = "*.html", use = [ "browser", "edit", "reveal" ] },
  { url = "*.htm",  use = [ "browser", "edit", "reveal" ] },
  { mime = "text/html", use = [ "browser", "edit", "reveal" ] },
]
